# CI: runs on every push and pull request. If it's red, don't release.
name: ci

on:
  push:
  pull_request:

# The workflow's GITHUB_TOKEN can only read the repo (least privilege: CI needs nothing else)
permissions:
  contents: read

jobs:
  # Job name "test" is a required status check on main (branch protection, set in the homelab's tofu)
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA, not tag: a tag can be moved to other code, a SHA can't
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same script as on a laptop: shellcheck, hadolint, bats, each in a pinned container
      - run: scripts/test.sh

  # Job name "build" is the second required check: proves the Dockerfile still builds after every change.
  # Nothing is pushed (releases are release.yml's job).
  build:
    needs: test          # no point building if the tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Buildx is Docker's modern builder (BuildKit): caching, multi-platform builds
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
